<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skill Builder</title>
<meta name="description" content="One hub for everything you are learning: a learning calendar around your classes and hockey, spaced-repetition drills, graded practice and levels for poker, chess, Swedish, Hebrew, Spanish, quant games and your coursework.">
<meta name="theme-color" content="#141A24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skill Builder">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --ink:#141A24; --felt:#1C2431; --raise:#222C3B; --line:#2E3849;
  --bone:#E9E5DB; --dim:#7E8AA0; --faint:#4E5A6E;
  --green:#34A96F; --red:#D14B41; --gold:#D4A03C; --blue:#5B8CC4; --purple:#8B7BD6;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Cambria Math","STIX Two Math",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%} body{min-height:100%}
body{background:var(--ink); color:var(--bone); font-family:var(--sans); font-size:14.5px; line-height:1.5; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%}
[hidden]{display:none !important}
a{color:var(--gold)}
button{font:inherit; color:inherit}
h1,h2,h3,h4{font-weight:650; letter-spacing:-.01em}
small{color:var(--dim)}
kbd{font:11px var(--mono); color:var(--faint); border:1px solid var(--line); border-radius:4px; padding:0 4px; margin-left:4px}
.rtl{direction:rtl; unicode-bidi:isolate}
.tw{font-size:1.15em} .tw.big{font-size:2.2em; line-height:1.2} .tr{color:var(--dim); font-style:italic; margin-left:6px}

/* ---- header and navigation ---- */
.top{position:sticky; top:0; z-index:30; background:rgba(20,26,36,.94); backdrop-filter:saturate(1.4) blur(10px); -webkit-backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line)}
.topin{max-width:1060px; margin:0 auto; padding:0 20px; height:58px; display:flex; align-items:center; gap:16px}
.brand{display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--dim); font-size:17px; flex:0 0 auto}
.brand .mark{width:26px; height:26px; border-radius:7px; border:2px solid var(--gold); display:grid; place-items:center; color:var(--green); font-size:13px; font-weight:800}
.brand b{color:var(--bone); font-weight:700}
.nav{display:flex; gap:2px; flex:1; justify-content:center}
.navi{position:relative; display:flex; align-items:center; gap:7px; padding:8px 12px; border-radius:8px; color:var(--dim); text-decoration:none; font-size:14px; font-weight:500}
.navi svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.navi:hover{color:var(--bone); background:var(--felt)}
.navi[aria-current="page"]{color:var(--bone); background:var(--raise)} .navi[aria-current="page"] svg{stroke:var(--gold)}
.nbadge{font-style:normal; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--gold); color:#150f02; font-size:10.5px; font-weight:700; display:inline-grid; place-items:center}
.nbadge.red{background:var(--red); color:#fff}
.topr{flex:0 0 auto; display:flex; align-items:center; gap:8px; margin-left:auto}
.gpill{display:inline-flex; align-items:center; gap:6px; padding:3px 10px 3px 4px; border-radius:20px; border:1px solid var(--line); color:var(--dim); text-decoration:none; font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap}
.gpill:hover{border-color:var(--gold); color:var(--bone)} .gpill .gs{filter:grayscale(1); opacity:.7} .gpill .gs.lit{filter:none; opacity:1; color:var(--bone)}
.gring .bg{fill:none; stroke:var(--line); stroke-width:4} .gring .fg{fill:none; stroke:var(--gold); stroke-width:4; stroke-linecap:round; transition:stroke-dasharray .4s} .gring .fg.done{stroke:var(--green)}
.spill{font:11px var(--mono); letter-spacing:.06em; text-transform:uppercase; color:var(--dim); background:none; border:1px solid var(--line); border-radius:20px; padding:4px 10px; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.spill i{width:7px; height:7px; border-radius:50%; background:var(--faint)} .spill.on i{background:var(--green)} .spill.busy i{background:var(--gold); animation:pulse 1s infinite} .spill.error i{background:var(--red)}
@keyframes pulse{50%{opacity:.3}}
@media(max-width:1100px){ .navi span{display:none} .navi{padding:8px 10px} .gpill .gx{display:none} }
@media(max-width:760px){
  .top{backdrop-filter:none; -webkit-backdrop-filter:none; background:var(--ink)} .topin{height:52px; padding:0 14px}
  .nav{position:fixed; left:0; right:0; bottom:0; z-index:30; justify-content:space-around; gap:0; background:rgba(20,26,36,.97); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .navi{flex-direction:column; gap:3px; padding:5px 8px; font-size:10.5px; flex:1; max-width:90px} .navi span{display:block} .navi[aria-current="page"]{background:none} .navi[aria-current="page"] span{color:var(--gold)}
  .navi .nbadge{position:absolute; top:0; left:calc(50% + 6px); height:16px; min-width:16px; font-size:9.5px}
  .wrap{padding:16px 14px calc(96px + env(safe-area-inset-bottom))} .spill{font-size:10px; padding:3px 8px}
}
.wrap{max-width:1060px; margin:0 auto; padding:22px 20px 80px}

/* ---- shared ---- */
.panel{background:var(--felt); border:1px solid var(--line); border-radius:12px; padding:18px}
.panel.tight{padding:14px 16px}
.ph{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.ph h3{font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); font-weight:600}
.ph a,.ph span{font-size:12.5px; color:var(--faint)} .ph a{color:var(--gold); text-decoration:none} .ph a:hover{text-decoration:underline}
.pnote{font-size:13px; color:var(--dim); line-height:1.55; margin-top:10px} .pnote a{color:var(--gold)}
.pbar{height:6px; border-radius:3px; background:var(--line); overflow:hidden} .pbar span{display:block; height:100%; background:var(--green); border-radius:3px}
.pbar.gold span{background:var(--gold)}
.clist > div{display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13.5px; align-items:center}
.clist > div:last-child{border-bottom:0} .clist span{color:var(--bone)} .clist b{font-weight:500; color:var(--dim); white-space:nowrap} .clist b.due{color:var(--gold)}
.clist small{display:block; color:var(--faint); font-size:12px}
.row{display:flex; gap:8px; align-items:stretch; flex-wrap:wrap}
button.act{font-family:var(--sans); font-size:14px; background:var(--bone); color:var(--ink); border:0; border-radius:8px; padding:11px 18px; min-height:42px; font-weight:600; cursor:pointer; transition:background .12s, transform .06s; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px}
button.act:hover{background:#fff} button.act:active{transform:translateY(1px)}
button.act.go{background:var(--gold); color:#150f02} button.act.go:hover{background:#E5B455}
button.act.ghost{background:transparent; color:var(--dim); border:1px solid var(--line)} button.act.ghost:hover{color:var(--bone); border-color:var(--bone)}
button.act.sm{padding:7px 12px; min-height:34px; font-size:13px}
button.act.danger{background:transparent; color:var(--red); border:1px solid rgba(209,75,65,.5)}
button.act:disabled{opacity:.45; cursor:default}
.chip{font-family:var(--sans); font-size:12.5px; background:transparent; color:var(--faint); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer}
.chip:hover{color:var(--dim); border-color:var(--dim)} .chip[aria-pressed="true"],.chip.on{color:var(--ink); background:var(--bone); border-color:var(--bone)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.subnav{display:inline-flex; gap:2px; background:var(--felt); border:1px solid var(--line); border-radius:9px; padding:3px; margin-bottom:18px; max-width:100%; overflow-x:auto}
.subnav a{padding:7px 13px; border-radius:7px; color:var(--dim); text-decoration:none; font-size:13.5px; font-weight:500; white-space:nowrap}
.subnav a:hover{color:var(--bone)} .subnav a[aria-current="page"]{background:var(--raise); color:var(--bone)}
.vhead{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:16px}
.vhead h1{font-size:26px} .vhead p{font-size:14px; color:var(--dim); margin-top:4px; max-width:64ch; line-height:1.5}
.crumbs{font-size:13px; color:var(--faint); display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px} .crumbs a{color:var(--dim); text-decoration:none} .crumbs a:hover{color:var(--gold)}
.kick{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:6px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px} .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
@media(max-width:820px){ .grid2,.grid3{grid-template-columns:1fr} }
.stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr)); gap:10px; margin:14px 0}
.stat{border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:var(--ink)} .stat b{display:block; font-size:20px; font-variant-numeric:tabular-nums} .stat span{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim)}
.stat b.hi{color:var(--green)} .stat b.mid{color:var(--gold)} .stat b.lo{color:var(--red)}
.hint{font-size:12px; color:var(--faint); margin-top:10px}
.xpchip{font-size:12px; font-weight:700; color:var(--gold); border:1px solid rgba(212,160,60,.5); border-radius:12px; padding:2px 9px; font-variant-numeric:tabular-nums}
.tag{display:inline-block; font-size:10.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; border-radius:4px; padding:2px 6px; background:var(--raise); color:var(--dim); vertical-align:2px}
.tag.gold{background:var(--gold); color:#150f02} .tag.red{background:var(--red); color:#fff} .tag.green{background:var(--green); color:#062012} .tag.blue{background:var(--blue); color:#fff}
.toasts{position:fixed; right:16px; bottom:16px; z-index:60; display:flex; flex-direction:column; gap:8px; align-items:flex-end; pointer-events:none}
@media(max-width:820px){ .toasts{bottom:84px; left:16px; right:16px; align-items:stretch} }
.toast{background:var(--raise); border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:8px; padding:10px 14px; font-size:13px; color:var(--dim); box-shadow:0 6px 24px rgba(0,0,0,.35); max-width:380px; animation:tin .25s ease-out; transition:opacity .4s, transform .4s}
.toast b{color:var(--bone)} .toast.goal{border-left-color:var(--green)} .toast.xp{padding:6px 12px; font-size:12px} .toast.out{opacity:0; transform:translateY(6px)}
@keyframes tin{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
details.help{margin-top:16px; border-top:1px solid var(--line); padding-top:12px}
details.help summary{font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); cursor:pointer; list-style:none} details.help summary::-webkit-details-marker{display:none} details.help summary:before{content:"+ "; color:var(--gold)} details.help[open] summary:before{content:"− "}
details.help ol,details.help ul{margin:12px 0 0 18px; font-size:13.5px; color:var(--dim); line-height:1.6} details.help li{margin-bottom:6px} details.help b{color:var(--bone)}
table.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
table.tbl th{text-align:left; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); font-weight:500; padding:0 10px 7px; border-bottom:1px solid var(--line)}
table.tbl td{padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; font-variant-numeric:tabular-nums} table.tbl tr:last-child td{border-bottom:0}
table.tbl td:first-child{color:var(--bone); font-weight:500} table.tbl.rtl td:first-child{font-size:16px}
.cap{font-size:12.5px; color:var(--dim); line-height:1.55; margin-top:8px}
input[type=text],input[type=search],input[type=number],input[type=time],input[type=date],select,textarea{background:var(--ink); color:var(--bone); border:1px solid var(--line); border-radius:8px; padding:9px 11px; font:inherit; outline:none; width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label.f{display:block; font-size:12px; color:var(--dim); margin-bottom:4px; letter-spacing:.04em}
.field{margin-bottom:12px}
.empty{padding:28px 18px; text-align:center; color:var(--dim); font-size:13.5px; border:1px dashed var(--line); border-radius:12px}
.flash{animation:tin .3s ease-out}

/* ---- home ---- */
.hgreet{margin-bottom:16px} .hgreet h1{font-size:28px} .hgreet p{color:var(--dim); margin-top:2px}
.hero{background:linear-gradient(135deg, rgba(212,160,60,.13), rgba(212,160,60,0) 60%), var(--felt); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:12px; padding:22px; margin-bottom:16px}
.hero h2{font-size:22px; margin-bottom:6px} .hero p{font-size:14.5px; color:var(--dim); line-height:1.6; margin-bottom:14px; max-width:68ch}
.plan{display:flex; flex-direction:column; gap:8px; margin:14px 0}
.pblock{display:grid; grid-template-columns:62px 1fr auto; gap:12px; align-items:center; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--ink); text-decoration:none; color:inherit}
.pblock:hover{border-color:var(--dim)} .pblock.done{opacity:.55} .pblock.done .pbt b{text-decoration:line-through}
.pblock.deferred{opacity:.6; border-style:dashed}
.pbt b{display:block; font-size:14.5px; color:var(--bone)} .pbt span{display:block; font-size:12.5px; color:var(--dim); margin-top:2px; line-height:1.45}
.pbat{font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap} .pbat b{display:block; color:var(--dim); font-weight:500}
.pbm{display:flex; flex-direction:column; align-items:center; gap:4px} .pbm b{font-size:16px; font-variant-numeric:tabular-nums} .pbm i{font-style:normal; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint)}
.dot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px}
.cgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px; margin:16px 0}
.ccard{display:block; text-decoration:none; color:inherit; background:var(--felt); border:1px solid var(--line); border-radius:12px; padding:16px; border-top:3px solid var(--line); position:relative}
.ccard:hover{border-color:var(--dim)}
.ccard .cg{font-size:22px; line-height:1; margin-bottom:8px; font-family:var(--serif)} .ccard b{display:block; font-size:16px} .ccard .lv{font-size:12.5px; color:var(--gold); margin:2px 0 8px} .ccard .cm{font-size:12.5px; color:var(--dim); line-height:1.45}
.ccard .cdue{position:absolute; top:12px; right:12px}
.ccard .pbar{margin-top:10px}
.tspark{display:flex; align-items:flex-end; gap:3px; height:52px; margin:8px 0 4px} .tspark i{flex:1; background:var(--line); border-radius:2px 2px 0 0; min-height:3px} .tspark i.on{background:var(--green)} .tspark i.now{background:var(--gold)}
.tsparkcap{display:flex; justify-content:space-between; font-size:11px; color:var(--faint)}
.hfoot{margin-top:26px; font-size:12px; color:var(--faint); text-align:center} .hfoot a{color:var(--dim)}

/* ---- calendar ---- */
.week{display:grid; grid-template-columns:48px repeat(7,1fr); gap:0; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--felt); font-size:11.5px}
.week .hd{padding:8px 4px; text-align:center; border-bottom:1px solid var(--line); border-left:1px solid var(--line); color:var(--dim)} .week .hd b{display:block; color:var(--bone); font-size:13px} .week .hd.today{background:rgba(212,160,60,.1)} .week .hd.today b{color:var(--gold)}
.week .hrs{position:relative; border-right:1px solid var(--line)} .week .hrs i{position:absolute; left:4px; font-style:normal; color:var(--faint); font-size:10px; transform:translateY(-50%)}
.week .col{position:relative; border-left:1px solid var(--line); background-image:linear-gradient(var(--line) 1px, transparent 1px); background-size:100% var(--hour)}
.week .col.today{background-color:rgba(212,160,60,.04)}
.evt{position:absolute; left:3px; right:3px; border-radius:5px; padding:3px 5px; font-size:10.5px; line-height:1.25; overflow:hidden; color:#fff; cursor:default}
.evt.class{background:rgba(91,140,196,.75)} .evt.hockey{background:rgba(209,75,65,.75)} .evt.work{background:rgba(126,138,160,.6)} .evt.other{background:rgba(126,138,160,.45)}
.evt.study{background:rgba(52,169,111,.22); border:1px solid rgba(52,169,111,.7); color:var(--bone)} .evt.study.school{background:rgba(139,123,214,.22); border-color:rgba(139,123,214,.8)} .evt.study.deferred{opacity:.5; border-style:dashed}
.evt b{display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fc{display:grid; grid-template-columns:repeat(7,1fr); gap:6px} .fc > div{border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--ink); min-height:70px; font-size:12px}
.fc b{display:block; color:var(--dim); font-size:11px; margin-bottom:4px} .fc .n{font-size:18px; font-variant-numeric:tabular-nums} .fc .by{display:flex; flex-wrap:wrap; gap:3px; margin-top:4px} .fc .by i{font-style:normal; font-size:10px; padding:1px 5px; border-radius:4px; background:var(--raise); color:var(--dim)}
.fc > div.today{border-color:var(--gold)} .fc > div.heavy{border-color:rgba(209,75,65,.6)}
@media(max-width:760px){ .fc{grid-template-columns:repeat(4,1fr)} }
.month{display:grid; grid-template-columns:repeat(7,1fr); gap:4px} .month > div{aspect-ratio:1; border-radius:6px; background:var(--ink); border:1px solid var(--line); padding:4px; font-size:10.5px; color:var(--faint); position:relative; overflow:hidden}
.month > div.on{border-color:transparent} .month > div .bars{position:absolute; left:3px; right:3px; bottom:3px; display:flex; flex-direction:column; gap:1px} .month > div .bars i{display:block; height:3px; border-radius:2px}
.month > div.today{outline:2px solid var(--gold)} .month .dn{position:absolute; top:3px; left:4px}
.legend{display:flex; flex-wrap:wrap; gap:10px 16px; font-size:12px; color:var(--dim); margin-top:10px}
.busylist > div{display:grid; grid-template-columns:1fr 90px 90px auto; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px}
.busylist > div:last-child{border-bottom:0}
@media(max-width:620px){ .busylist > div{grid-template-columns:1fr 70px 70px auto; font-size:12px} }
.daytabs{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:12px}
.prio{display:grid; grid-template-columns:1fr auto; gap:8px 12px; align-items:center; font-size:13.5px} .prio select{width:auto}

/* ---- course hub ---- */
.chead{display:flex; gap:16px; align-items:flex-start; margin-bottom:16px; flex-wrap:wrap}
.chead .cg{width:54px; height:54px; border-radius:14px; display:grid; place-items:center; font-size:26px; font-family:var(--serif); background:var(--felt); border:1px solid var(--line); flex:none}
.chead h1{font-size:26px} .chead p{color:var(--dim); margin-top:2px; max-width:66ch; line-height:1.5}
.chead .cmeta{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--faint); margin-top:8px} .chead .cmeta b{color:var(--gold); font-weight:600}
.lvstrip{display:flex; gap:4px; margin-top:8px} .lvstrip i{flex:1; height:6px; border-radius:3px; background:var(--line)} .lvstrip i.on{background:var(--gold)}
.pathnext{display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:var(--felt); border:1px solid var(--gold); border-radius:10px; padding:14px 18px; margin-bottom:18px}
.pathnext span{font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:600} .pathnext b{font-size:16px} .pathnext em{font-style:normal; color:var(--faint); font-size:13px; flex:1}
.placebox{display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px; padding:14px 16px; border:1px dashed var(--line); border-radius:10px; margin-bottom:16px; font-size:13.5px; color:var(--dim)} .placebox b{color:var(--bone)} .placebox span{flex:1 1 320px}
.stages{list-style:none; position:relative} .stages:before{content:""; position:absolute; left:33px; top:26px; bottom:26px; width:2px; background:var(--line)}
.stage{position:relative; margin-bottom:12px; background:var(--felt); border:1px solid var(--line); border-radius:10px; overflow:hidden} .stage.cur{border-color:rgba(212,160,60,.6)}
.shead{display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:none; border:0; color:inherit; padding:16px 18px; cursor:pointer} .shead:hover{background:var(--raise)}
