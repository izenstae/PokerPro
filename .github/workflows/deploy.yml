name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the hub, PokerPro and the service worker
        run: node build.js
      - name: Test PokerPro, the hub, and Math 340
        run: npm test
      - name: Assemble the site
        run: |
          mkdir -p _site/poker _site/school
          cp index.html sw.js _site/
          cp site/manifest.webmanifest site/icon.svg _site/
          cp poker/index.html poker/manifest.webmanifest poker/icon.svg poker/sw.js _site/poker/
          cp -r school/math340 _site/school/math340
          rm -rf _site/school/math340/tools _site/school/math340/docs
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
